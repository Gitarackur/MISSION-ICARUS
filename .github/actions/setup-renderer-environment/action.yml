name: Setup renderer build environment

description: |
  Installs the Node.js, Python, .NET, and R toolchains along with the
  application and renderer dependencies needed to build bundled renderer
  runtimes and package installers.

inputs:
  node-version:
    description: Node.js version to install.
    required: false
    default: "20"
  python-version:
    description: Python version used to build the Python plot renderer.
    required: false
    default: "3.13"
  dotnet-version:
    description: .NET SDK version used to build the F# plot renderer.
    required: false
    default: "10.0.x"
  r-version:
    description: R version used to vendor the R plot renderer runtime.
    required: false
    default: "4.5.1"

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    - name: Setup Python (Python plot renderer)
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: assets/scripts/python/Pipfile.lock

    - name: Setup .NET SDK (F# plot renderer)
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Setup R (R plot renderer)
      uses: r-lib/actions/setup-r@v2
      with:
        # Keep the bundled renderer reproducible across all runner images.
        # R 4.6.1 currently access-violates while loading ragg on Windows.
        r-version: ${{ inputs.r-version }}
        use-public-rspm: true

    - name: Install R renderer and statistics packages
      uses: r-lib/actions/setup-r-dependencies@v2
      with:
        # Runtime packaging only needs Depends, Imports, and LinkingTo.
        # Installing all Suggests introduces a limma <-> vsn solver cycle.
        dependencies: '"hard"'
        packages: |
          any::jsonlite
          any::ggplot2
          any::ragg
          bioc::limma
          any::WGCNA

    - name: Verify R renderer and statistics packages
      shell: bash
      run: >-
        Rscript -e 'packages <- c("jsonlite", "ggplot2", "ragg", "limma", "WGCNA");
        stopifnot(all(vapply(packages, requireNamespace, logical(1), quietly = TRUE)));
        cat("R renderer packages loaded successfully\n")'

    - name: Install application dependencies
      shell: bash
      run: npm ci --ignore-scripts

    - name: Rebuild native modules
      shell: bash
      run: npx electron-rebuild -f -w better-sqlite3

    - name: Install Python renderer build tooling
      shell: bash
      env:
        PIP_DISABLE_PIP_VERSION_CHECK: "1"
      run: python -m pip install "pipenv==2025.0.4"
