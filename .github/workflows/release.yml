name: Build & Release Mission Icarus

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Force a full renderer runtime rebuild instead of reusing cached runtimes.
        type: boolean
        required: false
        default: false
      clean_nuitka_cache:
        description: Delete the Nuitka compiler cache before rebuilding for a fully cold Python compiler run (most useful with force_rebuild).
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a release mid-flight. `create-release` publishes the tag and
  # release before installers are uploaded, so a cancellation leaves a
  # published release with missing assets.
  cancel-in-progress: false

jobs:
  version-bump:
    name: Auto Version Bump
    if: startsWith(github.ref, 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.version.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci --ignore-scripts

      - id: version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          npm version patch --no-git-tag-version
          new_version=$(node -p "require('./package.json').version")

          git add package.json package-lock.json
          git commit -m "🔖 bump: release v${new_version}" || true
          git tag "v${new_version}"

          echo "new_tag=v${new_version}" >> $GITHUB_OUTPUT

      - run: git push origin main --follow-tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  create-release:
    name: Create GitHub Release
    needs: version-bump
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ needs.version-bump.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version-bump.outputs.new_tag }}
          name: Mission Icarus ${{ needs.version-bump.outputs.new_tag }}
          prerelease: false
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-upload:
    name: Build & Upload Installers
    needs: create-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.new_tag }}
          fetch-depth: 0

      - name: Setup renderer build environment
        uses: ./.github/actions/setup-renderer-environment

      - name: Prepare macOS notarization assets
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          if [ -n "${{ secrets.APPLE_API_KEY }}" ] && [ -n "${{ secrets.APPLE_API_KEY_ID }}" ]; then
            KEY_PATH="$RUNNER_TEMP/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8"
            printf '%s' "${{ secrets.APPLE_API_KEY }}" > "$KEY_PATH"
            echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          fi

      - name: Prepare renderer runtimes
        uses: ./.github/actions/prepare-renderer-runtimes
        with:
          force: ${{ github.event.inputs.force_rebuild || 'false' }}
          clean-nuitka-cache: ${{ github.event.inputs.clean_nuitka_cache || 'false' }}

      - name: Install Linux packaging dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse libarchive-tools

      - name: Build macOS app
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          VERSION=${{ needs.create-release.outputs.new_tag }}
          VERSION_NO_V="${VERSION#v}"
          echo "Building version: $VERSION_NO_V"

          if [ -n "${{ secrets.CSC_LINK }}" ] && [ -n "${{ secrets.CSC_KEY_PASSWORD }}" ]; then
            echo "Using mac signing credentials."
            export CSC_LINK="${{ secrets.CSC_LINK }}"
            export CSC_KEY_PASSWORD="${{ secrets.CSC_KEY_PASSWORD }}"
            if [ -n "$APPLE_API_KEY_PATH" ] || [ -n "$APPLE_ID" ]; then
              npm run build -- --publish never
            else
              echo "No notarization credentials detected. Building a signed but unnotarized app for verified DMG packaging."
              npm run prepare:renderer:runtimes
              npm run build:application
              npm run package:desktop -- --mac dir --publish never
            fi
          else
            echo "No mac signing credentials detected. Building an ad hoc-signed macOS app."
            npm run prepare:renderer:runtimes
            npm run build:application
            CSC_IDENTITY_AUTO_DISCOVERY=false npm run package:desktop -- --mac dir --publish never
          fi

          APP_PATH=$(find "release/$VERSION_NO_V" -name "*.app" | head -n 1)
          echo "Found .app at: $APP_PATH"

          if [ -z "${{ secrets.CSC_LINK }}" ] || [ -z "${{ secrets.CSC_KEY_PASSWORD }}" ] || { [ -z "$APPLE_API_KEY_PATH" ] && [ -z "$APPLE_ID" ]; }; then
            if [ -z "$APP_PATH" ]; then
              echo "No macOS app bundle was produced." >&2
              exit 1
            fi

            DMG_PATH="release/$VERSION_NO_V/Icarus-Mac-${VERSION_NO_V}-Installer.dmg"
            bash .github/scripts/package-macos.sh "$APP_PATH" "$DMG_PATH"

            if [ -z "$APPLE_API_KEY_PATH" ] && [ -z "$APPLE_ID" ]; then
              NOTE_PATH="release/$VERSION_NO_V/Icarus-Mac-${VERSION_NO_V}-Install-Notes.txt"
              printf '%s\n' \
                'Icarus macOS install notes' \
                '=========================' \
                '' \
                'This build is sealed with a valid bundle signature but is not notarized by Apple.' \
                'macOS will warn that Apple cannot verify the developer; it should not report a damaged app.' \
                '' \
                'Recommended install path:' \
                '1. Open the DMG and drag Icarus.app into Applications.' \
                '2. Try to open Icarus once, then open System Settings > Privacy & Security.' \
                '3. Find the message that Icarus was blocked and choose Open Anyway.' \
                '4. Confirm Open when macOS asks. This preserves the user-controlled Gatekeeper decision.' \
                '' \
                'Full notarization requires Apple Developer credentials, which are not currently' \
                'configured for this build.' \
                > "$NOTE_PATH"
            fi
          fi

      - name: Build Windows app
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          npm run prepare:renderer:runtimes
          npm run build:application
          node scripts/run-command-with-retry.mjs --attempts 3 --delay-ms 15000 -- npm run package:windows -- --publish never

      - name: Build Linux app
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: npm run build:linux -- --publish never

      - name: Find built installers dynamically
        id: find_files
        shell: bash
        run: |
          VERSION=${{ needs.create-release.outputs.new_tag }}
          VERSION_NO_V="${VERSION#v}"
          RELEASE_DIR="release/$VERSION_NO_V"

          echo "Looking for installers in $RELEASE_DIR"

          find "$RELEASE_DIR" -type f \( \
            -name "Icarus-Mac-*-Installer.dmg" -o \
            -name "Icarus-Mac-*.zip" -o \
            -name "Icarus-Mac-*.tar.gz" -o \
            -name "Icarus-Mac-*-Install-Notes.txt" -o \
            -name "Icarus-Windows-*-Setup.exe" -o \
            -name "Icarus-Linux-*.AppImage" \
          \) > files.txt || true

          echo "Found installer files:"
          cat files.txt || echo "No installer files found."

          FILES=$(paste -sd "," files.txt)
          echo "files=$FILES" >> $GITHUB_OUTPUT

      - name: Upload installers to GitHub Release
        if: steps.find_files.outputs.files != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.new_tag }}
          files: ${{ steps.find_files.outputs.files }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
