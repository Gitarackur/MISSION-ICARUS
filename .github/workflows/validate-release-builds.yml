name: Validate Release Builds

on:
  pull_request:
    paths:
      - ".github/actions/**"
      - ".github/workflows/release.yml"
      - ".github/workflows/validate-release-builds.yml"
      - "assets/scripts/**"
      - "electron-builder.json5"
      - "package.json"
      - "package-lock.json"
      - "scripts/prepare-renderer-runtimes.mjs"
      - "scripts/test-bundled-renderer-runtimes.mjs"
      - "scripts/test-renderer-runtime-preparation.mjs"
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Force a full renderer runtime rebuild instead of reusing cached runtimes.
        type: boolean
        required: false
        default: false
      clean_nuitka_cache:
        description: Delete the Nuitka compiler cache before rebuilding for a fully cold Python compiler run (most useful with force_rebuild).
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: validate-release-builds-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-release-build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
          - name: Linux x64
            os: ubuntu-latest
          - name: Windows x64
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup renderer build environment
        uses: ./.github/actions/setup-renderer-environment

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse libarchive-tools

      - name: Prepare renderer runtimes
        uses: ./.github/actions/prepare-renderer-runtimes
        with:
          force: ${{ github.event.inputs.force_rebuild || 'false' }}
          clean-nuitka-cache: ${{ github.event.inputs.clean_nuitka_cache || 'false' }}

      - name: Build macOS installer
        if: runner.os == 'macOS'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build -- --publish never

      - name: Build Linux installer
        if: runner.os == 'Linux'
        run: npm run build:linux -- --publish never

      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npm run build:windows -- --publish never
